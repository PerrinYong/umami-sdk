name: Publish npm package

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout released commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js and npm registry
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - name: Use npm with trusted-publishing support
        run: npm install --global npm@11.8.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.10'

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 8.0.x

      - name: Validate release tag and package metadata
        run: python tools/check_version.py --tag "${{ github.event.release.tag_name }}"

      - name: Require the released commit to belong to main
        shell: bash
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD origin/main

      - name: Test and package all SDK runtimes
        shell: pwsh
        run: ./tools/build-sdk.ps1 -OutputDirectory "$env:RUNNER_TEMP/sdk-packages"

      - name: Check immutable registry state
        id: registry
        working-directory: typescript
        shell: bash
        run: |
          package_name=$(node -p "require('./package.json').name")
          package_version=$(node -p "require('./package.json').version")
          package_tgz=$(find "$RUNNER_TEMP/sdk-packages" -maxdepth 1 -type f -name 'perrin-yong-umami-sdk-*.tgz' -print -quit)
          test -n "$package_tgz"
          local_integrity="sha512-$(node -e "const fs=require('node:fs');const c=require('node:crypto');process.stdout.write(c.createHash('sha512').update(fs.readFileSync(process.argv[1])).digest('base64'))" "$package_tgz")"
          published_integrity=$(npm view "${package_name}@${package_version}" dist.integrity --registry=https://registry.npmjs.org/ 2>/dev/null || true)
          echo "package_tgz=$package_tgz" >> "$GITHUB_OUTPUT"
          echo "local_integrity=$local_integrity" >> "$GITHUB_OUTPUT"
          if [ -n "$published_integrity" ]; then
            if [ "$published_integrity" != "$local_integrity" ]; then
              echo "::error::${package_name}@${package_version} exists with different content. npm versions are immutable."
              exit 1
            fi
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "The exact artifact is already published; continuing idempotently."
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish the tested npm artifact with provenance
        if: steps.registry.outputs.already_published != 'true'
        shell: bash
        run: npm publish "${{ steps.registry.outputs.package_tgz }}" --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify published package
        working-directory: typescript
        shell: bash
        run: |
          package_name=$(node -p "require('./package.json').name")
          package_version=$(node -p "require('./package.json').version")
          for attempt in $(seq 1 20); do
            published_version=$(npm view "${package_name}@${package_version}" version --registry=https://registry.npmjs.org/ 2>/dev/null || true)
            published_integrity=$(npm view "${package_name}@${package_version}" dist.integrity --registry=https://registry.npmjs.org/ 2>/dev/null || true)
            if [ "$published_version" = "$package_version" ] && [ "$published_integrity" = "${{ steps.registry.outputs.local_integrity }}" ]; then
              echo "Verified ${package_name}@${package_version} on attempt ${attempt}."
              exit 0
            fi
            echo "Registry has not exposed ${package_name}@${package_version} yet (attempt ${attempt}/20)."
            sleep 15
          done
          echo "::error::The public registry did not expose ${package_name}@${package_version} within five minutes."
          exit 1
